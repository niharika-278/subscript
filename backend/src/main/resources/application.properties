# =============================================================
# Subscript backend configuration  
# =============================================================

spring.application.name=subscript
server.port=8080

# --- MySQL connection -----------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/subscript_db
spring.datasource.username=${DB_USERNAME:YOUR_MYSQL_USERNAME}
spring.datasource.password=${DB_PASSWORD:YOUR_MYSQL_PASSWORD}

# --- JPA / Hibernate -------------------------------------------
# validate = Hibernate only checks that entities match the tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
